name: Quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.11.4"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12.13
          uv sync --frozen

      - name: Run formatting, linting, typing, and unit tests
        run: make check

      - name: Run PostgreSQL integration tests
        run: uv run pytest -m integration

      - name: Reproduce evaluation report
        run: |
          uv run catalog-evaluate \
            --reference demo/feeds/reference-products.csv \
            --candidate demo/feeds/supplier-north.json \
            --candidate demo/feeds/supplier-central.csv \
            --gold evaluation/gold_pairs.csv \
            --output evaluation/results.json
          git diff --exit-code -- evaluation/results.json

      - name: Audit locked runtime dependencies
        run: make audit

      - name: Scan repository and history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir . --redact --no-banner
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . --redact --no-banner

      - name: Scan repository dependencies and configuration
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            fs --exit-code 1 --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig /workspace

  container:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build

      - name: Scan application image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --skip-version-check --scanners vuln \
            --exit-code 1 --severity HIGH,CRITICAL \
            product-catalog-matcher-application:latest
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c \
            image --skip-version-check --scanners vuln \
            --exit-code 1 --severity HIGH,CRITICAL \
            product-catalog-matcher-database:17.10

      - name: Start local stack
        run: docker compose up --detach --wait

      - name: Verify runtime hardening
        run: |
          test "$(docker compose exec -T application id -u)" = "10001"
          test "$(docker compose exec -T database id -u)" != "0"
          application_id="$(docker compose ps -q application)"
          test "$(docker inspect "${application_id}" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"

      - name: Load demonstration data and smoke test
        run: |
          ./scripts/load-demo.sh
          curl --silent --show-error --fail http://localhost:8000/health/ready
          curl --silent --show-error --fail http://localhost:8000/ | grep "Catalog matching at a glance"
          curl --silent --show-error --fail http://localhost:8000/review | grep "3 open"
          curl --silent --show-error --fail http://localhost:8000/api/openapi.json >/dev/null

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
